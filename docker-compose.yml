version: '3.8'

services:
  backend:
    build: ./backend
    container_name: shopify-backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: "file:./dev.db"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx prisma generate && npx prisma db push && npm run dev"

  frontend:
    build: ./frontend
    container_name: shopify-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
